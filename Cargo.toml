[package]
name = "Launcher"
version = "1.0.0"
edition = "2021"

[dependencies]
anyhow = "1"
eframe = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
base64 = "0.22"
sha2 = "0.10"
ureq = { version = "2", features = ["json"] }

[build-dependencies]
winres = "0.1"

[profile.release]
opt-level = "z"
lto = true
panic = "abort"
strip = true
